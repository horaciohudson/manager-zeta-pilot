services:
  db:
    image: postgres:16-alpine
    container_name: manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zetapilot_manager_db}
      POSTGRES_USER: ${DB_USER:-zetapilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zetapilot_dev}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - manager-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zetapilot} -d ${DB_NAME:-zetapilot_manager_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: manager-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/zetapilot_manager_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-zetapilot}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-zetapilot_dev}
      SERVER_PORT: 8080
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build: ./Frontend
    container_name: manager-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  manager-db-data:
