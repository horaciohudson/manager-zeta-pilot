spring.config.import=optional:file:.env[.properties]
spring.application.name=manager-zeta-pilot
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zetapilot_manager_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=${JWT_EXPIRATION_MS:900000}
app.auth.refresh-token-ttl=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.cookies.secure=${SECURE_COOKIES:false}
app.settings.encryption-key=${SETTINGS_ENCRYPTION_KEY:}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
logging.level.org.springframework.security=WARN

